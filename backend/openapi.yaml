openapi: 3.1.0
info:
  title: 知序课堂 API
  version: 1.0.0
  description: |
    依据 backend/接口设计文档.md §5/§7。约定：
    - 统一响应包 { code, message, data, requestId }，code=0 成功；错误码表见设计文档 §5
    - 金额一律整数分；时间 ISO 8601 UTC，展示按 Asia/Shanghai
    - 创建类 POST 携带 Idempotency-Key 请求头（幂等）
    - 管理端写操作携带 version 乐观锁，冲突返回 409
    - Session 会话（Cookie），未登录 401、角色不符 403
servers:
  - url: /api/v1
tags:
  - name: auth
    description: 认证与会话
  - name: catalog
    description: 课程浏览/学习/收藏（用户端）
  - name: admin-courses
    description: 课程管理（管理端）
  - name: coupons
    description: 优惠券
  - name: orders
    description: 订单与模拟支付
  - name: groupons
    description: 拼团
  - name: flash-sales
    description: 秒杀
  - name: exams
    description: 题库与考试
  - name: community
    description: 学习社区与屏蔽词
  - name: user-center
    description: 用户中心
  - name: files
    description: 文件上传
  - name: admin-dashboard
    description: 管理工作台
  - name: health
    description: 健康检查
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Session 会话 Cookie（HttpOnly+Secure+SameSite）
  parameters:
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
      description: 页码，从 1 起
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: 每页条数，默认 20 最大 100
    courseId:
      in: path
      name: courseId
      required: true
      schema: { type: integer }
    chapterId:
      in: path
      name: cid
      required: true
      schema: { type: integer }
      description: 章节 id
    orderId:
      in: path
      name: id
      required: true
      schema: { type: integer }
    templateId:
      in: path
      name: templateId
      required: true
      schema: { type: integer }
    grouponId:
      in: path
      name: id
      required: true
      schema: { type: integer }
    groupId:
      in: path
      name: gid
      required: true
      schema: { type: integer }
    flashSaleId:
      in: path
      name: id
      required: true
      schema: { type: integer }
    questionId:
      in: path
      name: id
      required: true
      schema: { type: integer }
    examId:
      in: path
      name: id
      required: true
      schema: { type: integer }
    attemptId:
      in: path
      name: aid
      required: true
      schema: { type: integer }
    postId:
      in: path
      name: id
      required: true
      schema: { type: integer }
    commentId:
      in: path
      name: id
      required: true
      schema: { type: integer }
    wordId:
      in: path
      name: id
      required: true
      schema: { type: integer }
  headers:
    IdempotencyKey:
      description: 幂等键，创建类 POST 必填；同键重放返回首次结果
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    Ok:
      description: 成功（统一响应包）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Created:
      description: 创建成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Err400:
      description: 参数校验失败（code=1001）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Err401:
      description: 未登录（code=2001）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Err403:
      description: 无权访问/未购买/角色不符（code=2002 等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Err404:
      description: 资源不存在（code=3001 等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Err409:
      description: 冲突：乐观锁版本冲突/重复购买/幂等冲突（code=4003/4004 等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Err422:
      description: 业务规则不满足（code=4001/5001 等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Err429:
      description: 触发限流
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
  schemas:
    Envelope:
      type: object
      properties:
        code: { type: integer, description: 0=成功；非 0 为业务错误码，见接口设计文档 §5 }
        message: { type: string }
        data: { type: object, description: 各接口数据类型见路径描述 }
        requestId: { type: string }
      required: [code, message, requestId]
    Page:
      type: object
      description: 分页响应；items 元素类型见各接口描述
      properties:
        items: { type: array, items: { type: object } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
      required: [items, total, page, pageSize]

    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        nickname: { type: string }
        avatarKey: { type: string, nullable: true, description: 头像图片 key（image/YYYY/MM/DD/uuid.ext）；历史 http(s) 数据为 null }
        avatarUrl: { type: string, nullable: true, description: key 返回公开 URL（PUBLIC_BASE_URL + /uploadFiles/ + key），历史 http(s) 原样返回 }
        gender: { type: string, enum: [male, female, secret] }
        role: { type: string, enum: [user, admin] }
        createdAt: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [email, password, confirmPassword, nickname]
      properties:
        email: { type: string, format: email, minLength: 1 }
        password: { type: string, minLength: 8, maxLength: 64, description: D6 已决：8–64 位，鼓励混合字符 }
        confirmPassword: { type: string, minLength: 1 }
        nickname: { type: string, minLength: 1, maxLength: 30 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, minLength: 1 }
        password: { type: string, minLength: 1 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8, maxLength: 64 }
        confirmPassword: { type: string, minLength: 1 }

    CourseBrief:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string, enum: [video, audio] }
        coverKey: { type: string, nullable: true, description: 封面图片 key（image/YYYY/MM/DD/uuid.ext）；历史 http(s) 数据为 null }
        coverUrl: { type: string, nullable: true, description: key 返回公开 URL（PUBLIC_BASE_URL + /uploadFiles/ + key），历史 http(s) 原样返回 }
        instructor: { type: string, nullable: true }
        originalCents: { type: integer }
        saleCents: { type: integer }
        status: { type: string, enum: [draft, published, unpublished], description: 用户端仅返回 published }
        chapterCount: { type: integer, description: 仅管理端返回 }
        enrollmentCount: { type: integer, description: 仅管理端返回 }
        isRecommended: { type: boolean, description: 仅管理端返回；管理员手动推荐标记 }
    ChapterBrief:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        contentType: { type: string, enum: [video, audio] }
        sortOrder: { type: integer }
        visited: { type: boolean, description: 是否已播放完成；仅已登录已购用户返回 }
        content: { type: string, nullable: true, description: 媒体 key；仅管理端详情返回，用于编辑回填 }
    CourseDetail:
      allOf:
        - $ref: '#/components/schemas/CourseBrief'
        - type: object
          properties:
            version: { type: integer, description: 乐观锁版本；管理端编辑回传，用户端忽略 }
            intro: { type: string, nullable: true }
            detailRich: { type: string, nullable: true, description: 服务端净化后的富文本；图片 src 已重写为公开 URL，data-key 保留 }
            chapters:
              type: array
              items: { $ref: '#/components/schemas/ChapterBrief' }
              description: 未购买仅名称；正文需另行请求章节内容接口
            groupon: { $ref: '#/components/schemas/GrouponActivityBrief' }
            flashSale: { $ref: '#/components/schemas/FlashSaleActivityBrief' }
            claimableCoupons:
              type: array
              items: { $ref: '#/components/schemas/CouponTemplateBrief' }
    ChapterContent:
      type: object
      description: 需已购买（未购 403）
      properties:
        id: { type: integer }
        title: { type: string }
        contentType: { type: string, enum: [video, audio] }
        content: { type: string, nullable: true, description: video/audio=短期签名播放 URL；旧 key 无法解析时为 null }
        sortOrder: { type: integer }
    CourseCreateRequest:
      type: object
      required: [name, type, originalCents, saleCents, instructor, coverUrl]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        type: { type: string, enum: [video, audio] }
        originalCents: { type: integer, minimum: 0 }
        saleCents: { type: integer, minimum: 0, description: 不得高于原价 }
        instructor: { type: string, minLength: 1, description: 讲师名称，必填 }
        coverUrl: { type: string, minLength: 1, description: 提交图片 key（image/YYYY/MM/DD/uuid.ext，兼容历史 http(s) URL），必填 }
        intro: { type: string, nullable: true }
        detailRich: { type: string, nullable: true }
    CourseUpdateRequest:
      type: object
      required: [version]
      description: 可编辑字段按状态矩阵（设计文档 §3.3）；类型在首个章节保存后锁定
      properties:
        version: { type: integer, description: 乐观锁版本 }
        name: { type: string, minLength: 1, maxLength: 40, description: 传入时不可为空 }
        type: { type: string, enum: [video, audio] }
        originalCents: { type: integer }
        saleCents: { type: integer }
        instructor: { type: string, minLength: 1, description: 讲师名称；传入时不可为空 }
        coverUrl: { type: string, minLength: 1, description: 提交图片 key（image/YYYY/MM/DD/uuid.ext，兼容历史 http(s) URL）；传入时不可为空 }
        intro: { type: string, nullable: true }
        detailRich: { type: string, nullable: true }
    ChapterCreateRequest:
      type: object
      required: [title, contentType, content]
      properties:
        title: { type: string, minLength: 1, maxLength: 60 }
        contentType: { type: string, enum: [video, audio], description: 须与课程类型一致 }
        content: { type: string, minLength: 1, description: 必填；video/audio=媒体上传接口返回的 key }
    ChapterUpdateRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 60, description: 传入时不可为空 }
        content: { type: string, minLength: 1, description: 传入时不可为空；不传表示保持原正文 }
    ChapterReorderRequest:
      type: object
      required: [orderedChapterIds]
      properties:
        orderedChapterIds:
          type: array
          minItems: 1
          items: { type: integer }
          description: 全部章节 id 的新顺序；保存后从 1 连续编号
    CourseAdminWriteResult:
      type: object
      description: 管理端课程写操作返回（课程行摘要），前端消费 id/status/version
      properties:
        id: { type: integer }
        status: { type: string, enum: [draft, published, unpublished] }
        version: { type: integer }
    StudyRecord:
      type: object
      properties:
        courseId: { type: integer }
        courseName: { type: string }
        chapterCount: { type: integer }
        visitedCount: { type: integer }
        lastChapterId: { type: integer, nullable: true }
        lastChapterTitle: { type: string, nullable: true }
        progressPercent: { type: integer, description: 已访问章节数/总章节数 }
        completed: { type: boolean, description: 全部章节至少访问一次自动标记 }
        lastVisitedAt: { type: string, format: date-time, description: 最后学习时间；已购未观看为支付时间 }
    FavoriteCreateRequest:
      type: object
      required: [courseId]
      properties:
        courseId: { type: integer }

    CouponTemplateBrief:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        discountCents: { type: integer }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        totalQty: { type: integer }
        claimedCount: { type: integer, description: 当前未失效领取数 }
        status: { type: string, enum: [disabled, enabled] }
        courseIds: { type: array, items: { type: integer } }
        version: { type: integer, description: 乐观锁版本号（管理端编辑回传；用户端忽略） }
    CouponTemplateCreateRequest:
      type: object
      required: [name, discountCents, startAt, endAt, totalQty, perUserLimit, courseIds]
      properties:
        name: { type: string }
        discountCents: { type: integer, minimum: 1 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        totalQty: { type: integer, minimum: 1 }
        perUserLimit: { type: integer, default: 1, description: 本期服务端强制为 1 }
        courseIds: { type: array, items: { type: integer }, description: 仅已发布课程 }
        enableOnCreate: { type: boolean, default: false, description: 创建后立即启用（默认不选中） }
    CouponTemplateUpdateRequest:
      type: object
      required: [version]
      description: 仅停用态可编辑全部字段；启用态只读
      properties:
        version: { type: integer }
        name: { type: string }
        discountCents: { type: integer }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        totalQty: { type: integer }
        perUserLimit: { type: integer }
        courseIds: { type: array, items: { type: integer } }
    CouponClaim:
      type: object
      properties:
        id: { type: integer }
        templateId: { type: integer }
        templateName: { type: string }
        discountCents: { type: integer }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        courseIds: { type: array, items: { type: integer } }
        status: { type: string, enum: [unused, used, restored, invalid, expired] }
        claimedAt: { type: string, format: date-time }
        usedAt: { type: string, format: date-time, nullable: true }

    CheckoutPreviewData:
      type: object
      description: data 结构：服务端计价，客户端不传金额
      properties:
        courseId: { type: integer }
        activityType: { type: string, enum: [normal, groupon, flash_sale] }
        activityId: { type: integer, nullable: true }
        originalCents: { type: integer }
        currentCents: { type: integer }
        discountCents: { type: integer }
        paidCents: { type: integer, description: max(0, 当前价 − 券额) }
        couponClaimId: { type: integer, nullable: true }
    OrderCreateRequest:
      type: object
      required: [courseId]
      properties:
        courseId: { type: integer }
        activityType: { type: string, enum: [normal, groupon, flash_sale], default: normal }
        activityId: { type: integer, nullable: true, description: 拼团=团组 id；秒杀=活动 id }
        couponClaimId: { type: integer, nullable: true }
    Order:
      type: object
      properties:
        id: { type: integer }
        orderNo: { type: string }
        courseId: { type: integer }
        courseName: { type: string }
        activityType: { type: string, enum: [normal, groupon, flash_sale] }
        activityId: { type: integer, nullable: true }
        originalCents: { type: integer }
        currentCents: { type: integer }
        discountCents: { type: integer }
        paidCents: { type: integer }
        couponClaimId: { type: integer, nullable: true }
        status: { type: string, enum: [pending, paid, refunded, cancelled] }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    GrouponActivityBrief:
      type: object
      properties:
        id: { type: integer }
        courseId: { type: integer }
        courseName: { type: string }
        name: { type: string }
        priceCents: { type: integer }
        targetSize: { type: integer, minimum: 2 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        status: { type: string, enum: [not_started, ongoing, ended, cancelled] }
        version: { type: integer, description: 乐观锁版本号（管理端编辑回传） }
        courseCoverUrl: { type: string, nullable: true, description: 课程封面展示地址（用户端列表/详情补充） }
        courseOriginalCents: { type: integer, description: 课程原价（分，用户端列表/详情补充） }
    GrouponGroup:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, success, failed] }
        memberCount: { type: integer }
        targetSize: { type: integer }
        expiresAt: { type: string, format: date-time }
        formedAt: { type: string, format: date-time, nullable: true }
        leaderNickname: { type: string, nullable: true, description: 团长昵称（公开详情补充） }
    GrouponCreateRequest:
      type: object
      required: [courseId, name, priceCents, targetSize, startAt, endAt]
      properties:
        courseId: { type: integer, description: 仅已发布课程；同课程活动时间不得重叠（含秒杀） }
        name: { type: string }
        priceCents: { type: integer, minimum: 0 }
        targetSize: { type: integer, minimum: 2 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time, description: 必须晚于开始时间 }
    GrouponUpdateRequest:
      type: object
      required: [version]
      description: 仅未开始活动可编辑
      properties:
        version: { type: integer }
        name: { type: string }
        priceCents: { type: integer }
        targetSize: { type: integer, minimum: 2 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }

    FlashSaleActivityBrief:
      type: object
      properties:
        id: { type: integer }
        courseId: { type: integer }
        courseName: { type: string }
        name: { type: string }
        priceCents: { type: integer }
        stock: { type: integer }
        sold: { type: integer }
        remaining: { type: integer, description: 剩余可购数量（Redis 预占后的服务端值） }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        status: { type: string, enum: [not_started, ongoing, ended, cancelled] }
        version: { type: integer, description: 乐观锁版本号（管理端编辑回传） }
        courseCoverUrl: { type: string, nullable: true, description: 课程封面展示地址（用户端列表/详情补充） }
        courseOriginalCents: { type: integer, description: 课程原价（分，用户端列表/详情补充） }
    FlashSaleCreateRequest:
      type: object
      required: [courseId, name, priceCents, stock, startAt, endAt]
      properties:
        courseId: { type: integer, description: 仅已发布课程；同课程活动时间不得与拼团/秒杀重叠 }
        name: { type: string }
        priceCents: { type: integer, minimum: 0 }
        stock: { type: integer, minimum: 1 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
    FlashSaleUpdateRequest:
      type: object
      required: [version]
      description: 仅未开始活动可编辑；库存不得小于已售；时间不得与同课程其他活动重叠
      properties:
        version: { type: integer }
        name: { type: string }
        priceCents: { type: integer }
        stock: { type: integer }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }

    QuestionUserView:
      type: object
      description: 用户视角题目：**不含答案与解析**（考试安全）
      properties:
        id: { type: integer }
        type: { type: string, enum: [single, multiple] }
        stem: { type: string }
        options:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              text: { type: string }
        score: { type: integer }
    QuestionAdminView:
      allOf:
        - $ref: '#/components/schemas/QuestionUserView'
        - type: object
          properties:
            answer: { type: array, items: { type: string }, description: 单选恰好 1 个；多选 ≥2 个 }
            analysis: { type: string }
            status: { type: string, enum: [enabled, disabled] }
            version: { type: integer, description: 乐观锁版本（管理端编辑回传） }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    QuestionCreateRequest:
      type: object
      required: [type, stem, options, answer, analysis, score]
      properties:
        type: { type: string, enum: [single, multiple] }
        stem: { type: string, minLength: 1 }
        options: { type: array, minItems: 2, maxItems: 6, items: { type: object, properties: { key: { type: string, minLength: 1 }, text: { type: string, minLength: 1 } } } }
        answer: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        analysis: { type: string, minLength: 1 }
        score: { type: integer, minimum: 1, description: 分值仅创建时确定，之后不可改 }
    QuestionUpdateRequest:
      type: object
      required: [version]
      description: 分值不可改
      properties:
        version: { type: integer }
        type: { type: string, enum: [single, multiple] }
        stem: { type: string, minLength: 1, description: 传入时不可为空 }
        options: { type: array, minItems: 2, maxItems: 6, items: { type: object, properties: { key: { type: string, minLength: 1 }, text: { type: string, minLength: 1 } } } }
        answer: { type: array, minItems: 1, items: { type: string, minLength: 1 }, description: 传入时不可为空 }
        analysis: { type: string, minLength: 1, description: 传入时不可为空 }

    ExamBrief:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        durationMin: { type: integer }
        passScore: { type: integer }
        totalScore: { type: integer }
        questionCount: { type: integer }
        status: { type: string, enum: [draft, published, ended] }
        publishedAt: { type: string, format: date-time, nullable: true }
    ExamAdminView:
      allOf:
        - $ref: '#/components/schemas/ExamBrief'
        - type: object
          properties:
            version: { type: integer, description: 乐观锁版本（管理端编辑回传） }
            questionIds:
              type: array
              items: { type: integer }
              description: 组卷题目 id，按出题顺序
    ExamCreateRequest:
      type: object
      required: [title, durationMin, passScore, questionIds]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, default: '' }
        durationMin: { type: integer, minimum: 1 }
        passScore: { type: integer, minimum: 1, description: 大于 0 且不超过总分 }
        questionIds: { type: array, minItems: 1, items: { type: integer }, description: 选题并定序；组卷不改分值，总分=分值之和 }
    ExamUpdateRequest:
      type: object
      required: [version]
      description: 仅草稿可编辑
      properties:
        version: { type: integer }
        title: { type: string, minLength: 1, description: 传入时不可为空 }
        description: { type: string }
        durationMin: { type: integer }
        passScore: { type: integer }
        questionIds: { type: array, minItems: 1, items: { type: integer }, description: 传入时不可为空；按新顺序重写草稿快照 }
    AttemptStartData:
      type: object
      description: data 结构：开始考试；题目不含答案；deadlineAt 为服务端权威时间
      properties:
        attemptId: { type: integer }
        examId: { type: integer }
        examTitle: { type: string }
        durationMin: { type: integer }
        deadlineAt: { type: string, format: date-time }
        totalScore: { type: integer }
        passScore: { type: integer }
        questions:
          type: array
          items: { $ref: '#/components/schemas/QuestionUserView' }
    SubmitRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: 键为题 id，值为所选选项 key 数组
    SubmitData:
      type: object
      description: data 结构：判分结果（多选需完全匹配且无错选才得分，无部分分）
      properties:
        attemptId: { type: integer }
        score: { type: integer }
        totalScore: { type: integer }
        passScore: { type: integer }
        passed: { type: boolean }
        submittedAt: { type: string, format: date-time }
    AttemptResultData:
      type: object
      description: data 结构：交卷后才返回答题详情、正确答案与解析
      properties:
        attemptId: { type: integer }
        examTitle: { type: string }
        score: { type: integer }
        totalScore: { type: integer }
        passScore: { type: integer }
        passed: { type: boolean }
        submittedAt: { type: string, format: date-time }
        questions:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/QuestionUserView'
              - type: object
                properties:
                  userAnswers: { type: array, items: { type: string } }
                  correctAnswers: { type: array, items: { type: string } }
                  analysis: { type: string }
    MyExamRecord:
      type: object
      description: 我的考试记录；未交卷时 score/passed/submittedAt 为 null
      properties:
        attemptId: { type: integer }
        examId: { type: integer }
        examTitle: { type: string }
        score: { type: integer, nullable: true }
        totalScore: { type: integer }
        passScore: { type: integer }
        passed: { type: boolean, nullable: true }
        submittedAt: { type: string, format: date-time, nullable: true }

    ReplyView:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        nickname: { type: string }
        replyToNickname: { type: string, nullable: true }
        content: { type: string, description: img 的 src 已换公开 URL，data-key 保留 }
        createdAt: { type: string, format: date-time }
    CommentView:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        nickname: { type: string }
        content: { type: string, description: img 的 src 已换公开 URL，data-key 保留 }
        createdAt: { type: string, format: date-time }
        replies:
          type: array
          items: { $ref: '#/components/schemas/ReplyView' }
    PostBrief:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        nickname: { type: string }
        avatarKey: { type: string, nullable: true, description: 作者头像图片 key（image/YYYY/MM/DD/uuid.ext）；历史 http(s) 数据为 null }
        avatarUrl: { type: string, nullable: true, description: key 返回公开 URL（PUBLIC_BASE_URL + /uploadFiles/ + key），历史 http(s) 原样返回 }
        content: { type: string, description: 净化后的富文本；img 的 src 已换公开 URL，data-key 保留 }
        likeCount: { type: integer }
        likedByMe: { type: boolean, description: 仅登录用户返回 }
        commentCount: { type: integer }
        createdAt: { type: string, format: date-time }
    PostDetail:
      allOf:
        - $ref: '#/components/schemas/PostBrief'
        - type: object
          properties:
            comments: { type: array, items: { $ref: '#/components/schemas/CommentView' } }
    PostCreateRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 2000, description: 屏蔽词校验命中则阻止（code=7001，附命中词） }
    CommentCreateRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 1000 }
        replyToUserId: { type: integer, nullable: true, description: 仅回复接口使用 }

    BlockedWord:
      type: object
      properties:
        id: { type: integer }
        word: { type: string }
        status: { type: string, enum: [enabled, disabled] }
    BlockedWordCreateRequest:
      type: object
      required: [word]
      properties:
        word: { type: string, minLength: 1, maxLength: 100 }
    BlockedWordUpdateRequest:
      type: object
      properties:
        word: { type: string, minLength: 1, maxLength: 100 }
        status: { type: string, enum: [enabled, disabled] }

    ProfileData:
      type: object
      description: data 结构
      properties:
        id: { type: integer }
        email: { type: string, description: 只读 }
        nickname: { type: string }
        avatarKey: { type: string, nullable: true, description: 头像图片 key（image/YYYY/MM/DD/uuid.ext）；历史 http(s) 数据为 null }
        avatarUrl: { type: string, nullable: true, description: key 返回公开 URL（PUBLIC_BASE_URL + /uploadFiles/ + key），历史 http(s) 原样返回 }
        gender: { type: string, enum: [male, female, secret] }
    ProfileUpdateRequest:
      type: object
      required: [nickname, gender]
      properties:
        nickname: { type: string, minLength: 1, maxLength: 30 }
        avatarUrl: { type: string, nullable: true, description: 提交图片 key（image/YYYY/MM/DD/uuid.ext，兼容历史 http(s) URL）；传 null 清空 }
        gender: { type: string, enum: [male, female, secret] }
    UploadData:
      type: object
      description: data 结构：图片上传结果
      properties:
        key: { type: string, description: 图片 key（image/YYYY/MM/DD/uuid.ext），前端应持久化该值 }
        url: { type: string, description: 公开访问 URL（PUBLIC_BASE_URL + /uploadFiles/ + key） }
    MediaUploadData:
      type: object
      description: data 结构：音视频上传结果
      properties:
        key: { type: string, description: 媒体 key（video|audio/YYYY/MM/DD/uuid.ext） }
        url: { type: string, description: 短期签名播放 URL，默认 4 小时 }
        mimeType: { type: string, description: 服务端识别的标准 MIME }
        size: { type: integer, description: 文件字节数 }
    OverviewData:
      type: object
      description: data 结构：学习概览统计
      properties:
        enrolledCount: { type: integer }
        completedCount: { type: integer }
        favoriteCount: { type: integer }
        couponCount: { type: integer }
        postCount: { type: integer }
    DashboardStats:
      type: object
      description: data 结构：管理端工作台统计
      properties:
        userCount: { type: integer }
        courseCount: { type: integer }
        publishedCourseCount: { type: integer }
        orderCount: { type: integer }
        paidOrderCount: { type: integer }
        revenueCents: { type: integer }
        ongoingGrouponCount: { type: integer }
        ongoingFlashSaleCount: { type: integer }

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: 注册（不自动登录，跳登录页）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/Err400' }
        '409': { $ref: '#/components/responses/Err409' }
        '429': { $ref: '#/components/responses/Err429' }
  /auth/login:
    post:
      tags: [auth]
      summary: 登录（邮箱或密码错误统一提示；角色由账号携带）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 'data: User'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400': { $ref: '#/components/responses/Err400' }
        '422':
          description: 邮箱或密码错误（code=2003，统一提示）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '429': { $ref: '#/components/responses/Err429' }
  /auth/logout:
    post:
      tags: [auth]
      summary: 退出登录（吊销会话）
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Err401' }
  /auth/me:
    get:
      tags: [auth]
      summary: 当前用户
      responses:
        '200':
          description: 'data: User'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Err401' }
  /auth/password:
    post:
      tags: [auth]
      summary: 修改密码（成功后吊销全部会话，需重新登录）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Err400' }
        '401': { $ref: '#/components/responses/Err401' }
        '422':
          description: 当前密码错误（code=2004）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /auth/verify-email:
    post:
      tags: [auth]
      summary: 邮箱验证【预留：D7 已决暂不启用】
      description: 本期返回 501，待接入邮件服务后实现
      security: []
      responses:
        '501': { description: 未实现（预留） }
  /auth/forgot-password:
    post:
      tags: [auth]
      summary: 发起密码重置【预留：D7 已决暂不启用】
      description: 本期返回 501，待接入邮件服务后实现
      security: []
      responses:
        '501': { description: 未实现（预留） }
  /auth/reset-password:
    post:
      tags: [auth]
      summary: 一次性 token 重置密码【预留：D7 已决暂不启用】
      description: 本期返回 501，待接入邮件服务后实现
      security: []
      responses:
        '501': { description: 未实现（预留） }

  /home/recommendations:
    get:
      tags: [catalog]
      summary: 首页推荐课程
      security: []
      responses:
        '200':
          description: 'data: { courses: [CourseBrief] }'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /courses:
    get:
      tags: [catalog]
      summary: 已发布课程列表（不含当前参与拼团/秒杀活动的课程）
      security: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 'data: Page（items: CourseBrief）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /courses/{courseId}:
    get:
      tags: [catalog]
      summary: 课程详情（含活动信息、可领券、章节目录仅名称）
      security: []
      parameters:
        - { $ref: '#/components/parameters/courseId' }
      responses:
        '200':
          description: 'data: CourseDetail'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404': { $ref: '#/components/responses/Err404' }
  /courses/{courseId}/chapters/{cid}/content:
    get:
      tags: [catalog]
      summary: 章节正文（需已购买；未购 403，仅返回章节名）
      parameters:
        - { $ref: '#/components/parameters/courseId' }
        - { $ref: '#/components/parameters/chapterId' }
      responses:
        '200':
          description: 'data: ChapterContent'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Err401' }
        '403': { $ref: '#/components/responses/Err403' }
        '404': { $ref: '#/components/responses/Err404' }
  /learning/{courseId}/chapters/{cid}/visit:
    post:
      tags: [catalog]
      summary: 记录章节访问（重算进度；全部章节至少访问一次自动标记已学完）
      parameters:
        - { $ref: '#/components/parameters/courseId' }
        - { $ref: '#/components/parameters/chapterId' }
      responses:
        '200':
          description: 'data: { progressPercent, completed }'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Err401' }
        '403': { $ref: '#/components/responses/Err403' }
        '404': { $ref: '#/components/responses/Err404' }
  /user/study-records:
    get:
      tags: [catalog]
      summary: 学习记录
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 'data: Page（items: StudyRecord）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Err401' }
  /favorites:
    post:
      tags: [catalog]
      summary: 收藏课程（幂等）
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FavoriteCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Err401' }
        '404': { $ref: '#/components/responses/Err404' }
  /favorites/{courseId}:
    delete:
      tags: [catalog]
      summary: 取消收藏（幂等）
      parameters:
        - { $ref: '#/components/parameters/courseId' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Err401' }
  /user/favorites:
    get:
      tags: [catalog]
      summary: 我的收藏（仅课程）
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 'data: Page（items: CourseBrief）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Err401' }

  /admin/courses:
    get:
      tags: [admin-courses]
      summary: 课程列表（全部状态，含草稿/下架）
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - in: query
          name: status
          schema: { type: string, enum: [draft, published, unpublished] }
      responses:
        '200':
          description: 'data: Page（items: CourseBrief，含 chapterCount/enrollmentCount）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Err401' }
        '403': { $ref: '#/components/responses/Err403' }
    post:
      tags: [admin-courses]
      summary: 创建课程（草稿；首个章节保存后类型锁定）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseCreateRequest' }
      responses:
        '201':
          description: 'data: CourseAdminWriteResult（新建草稿）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400': { $ref: '#/components/responses/Err400' }
        '401': { $ref: '#/components/responses/Err401' }
        '403': { $ref: '#/components/responses/Err403' }
  /admin/courses/{courseId}:
    get:
      tags: [admin-courses]
      summary: 课程详情（管理端视角，含草稿/下架）
      parameters:
        - { $ref: '#/components/parameters/courseId' }
      responses:
        '200':
          description: 'data: CourseDetail'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Err401' }
        '403': { $ref: '#/components/responses/Err403' }
        '404': { $ref: '#/components/responses/Err404' }
    put:
      tags: [admin-courses]
      summary: 编辑基本信息（按状态矩阵限制可编辑字段，version 乐观锁）
      parameters:
        - { $ref: '#/components/parameters/courseId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseUpdateRequest' }
      responses:
        '200':
          description: 'data: CourseAdminWriteResult'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400': { $ref: '#/components/responses/Err400' }
        '401': { $ref: '#/components/responses/Err401' }
        '403': { $ref: '#/components/responses/Err403' }
        '404': { $ref: '#/components/responses/Err404' }
        '409': { $ref: '#/components/responses/Err409' }
        '422': { $ref: '#/components/responses/Err422' }
  /admin/courses/{courseId}/publish:
    post:
      tags: [admin-courses]
      summary: 发布/重新发布课程
      parameters:
        - { $ref: '#/components/parameters/courseId' }
      responses:
        '200':
          description: 'data: CourseAdminWriteResult'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Err401' }
        '403': { $ref: '#/components/responses/Err403' }
        '404': { $ref: '#/components/responses/Err404' }
        '409': { $ref: '#/components/responses/Err409' }
        '422':
          description: 状态不允许（仅草稿/已下架可发布）；课程没有章节时也不可发布
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /admin/courses/{courseId}/unpublish:
    post:
      tags: [admin-courses]
      summary: 下架课程（下架后禁止新购买，已购用户仍可学习）
      parameters:
        - { $ref: '#/components/parameters/courseId' }
      responses:
        '200':
          description: 'data: CourseAdminWriteResult'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Err401' }
        '403': { $ref: '#/components/responses/Err403' }
        '404': { $ref: '#/components/responses/Err404' }
        '409': { $ref: '#/components/responses/Err409' }
        '422':
          description: 状态不允许（仅已发布可下架）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /admin/courses/{courseId}/recommend:
    post:
      tags: [admin-courses]
      summary: 设为首页推荐（仅已发布课程可标记）
      parameters:
        - { $ref: '#/components/parameters/courseId' }
      responses:
        '200':
          description: 'data: CourseAdminWriteResult'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Err401' }
        '403': { $ref: '#/components/responses/Err403' }
        '404': { $ref: '#/components/responses/Err404' }
        '409': { $ref: '#/components/responses/Err409' }
        '422':
          description: 课程未发布或已在推荐位
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /admin/courses/{courseId}/unrecommend:
    post:
      tags: [admin-courses]
      summary: 取消首页推荐（仅已发布课程可操作）
      parameters:
        - { $ref: '#/components/parameters/courseId' }
      responses:
        '200':
          description: 'data: CourseAdminWriteResult'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Err401' }
        '403': { $ref: '#/components/responses/Err403' }
        '404': { $ref: '#/components/responses/Err404' }
        '409': { $ref: '#/components/responses/Err409' }
        '422':
          description: 课程未发布或不在推荐位
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /admin/courses/{courseId}/chapters:
    post:
      tags: [admin-courses]
      summary: 新增章节（类型须与课程一致；草稿/已下架可操作）
      parameters:
        - { $ref: '#/components/parameters/courseId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChapterCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
